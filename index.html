const img={};let n=0;const keys=Object.keys(S);
for(const k of keys){img[k]=new Image();img[k].onload=()=>{if(++n==keys.length)ready()};img[k].src=S[k]}
const c=document.getElementById('c'),x=c.getContext('2d'),T=document.getElementById('title');
const MAPS={
 stovia:{name:'STOVIA, struyswijk',w:512,bg:'sbg',fg:'sfg',y0:208,y1:240},
 senen:{name:'Passer Senen',w:612,bg:'nbg',fg:'nfg',y0:228,y1:250}
};
let cur='stovia',fade=0,fadeDir=0,pending=null,tt=null,started=false,VW=256,VH=144;
const P={x:256,y:228,face:1,t:0};
function resize(){const W=Math.round((window.visualViewport&&visualViewport.width)||innerWidth),H=Math.round((window.visualViewport&&visualViewport.height)||innerHeight);c.style.width=W+'px';c.style.height=H+'px';const a=W/H;VH=144;VW=Math.round(VH*a);
 if(VW<176){VW=176;VH=Math.min(256,Math.round(VW/a))}
 VW=Math.min(VW,480);c.width=VW;c.height=VH;x.imageSmoothingEnabled=false}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));if(window.visualViewport)visualViewport.addEventListener('resize',resize);resize();
function setMap(id,spawnX,silent){cur=id;const m=MAPS[id];P.x=spawnX;P.y=Math.max(m.y0,Math.min(m.y1,P.y));if(!silent)showTitle(m.name)}
function showTitle(t){T.textContent=t;T.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>T.classList.remove('on'),2600)}
const K={};const map={ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r',ArrowUp:'u',w:'u',ArrowDown:'d',s:'d'};
addEventListener('keydown',e=>{if(map[e.key]){K[map[e.key]]=1;e.preventDefault()}});
addEventListener('keyup',e=>{if(map[e.key])K[map[e.key]]=0});
const ptr={};
function upd(){}
const dirOf=e=>({x:e.clientX,y:e.clientY});
c.addEventListener('pointerdown',e=>{ptr[e.pointerId]=dirOf(e);upd();e.preventDefault()});
c.addEventListener('pointermove',e=>{if(ptr[e.pointerId]!==undefined){ptr[e.pointerId]=dirOf(e);upd()}});
for(const ev of['pointerup','pointercancel','pointerleave'])c.addEventListener(ev,e=>{delete ptr[e.pointerId];upd()});
c.addEventListener('contextmenu',e=>e.preventDefault());
const WC=[35,91,149,207,263,320];
const st=document.getElementById('start'),go=document.getElementById('go');
function ready(){setMap('stovia',256,true);go.textContent='Ketuk untuk mulai';requestAnimationFrame(loop);
 st.addEventListener('pointerdown',begin);addEventListener('keydown',begin)}
function begin(){if(started)return;started=true;st.style.display='none';
 try{const d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen).call(d)}catch(e){}
 try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}
 showTitle(MAPS[cur].name)}
let last=0,camX=0,camY=0;
function loop(ts){
 const dt=Math.min((ts-last)/1000,.05);last=ts;const m=MAPS[cur];
 let mx=(K.r?1:0)-(K.l?1:0),my=(K.d?1:0)-(K.u?1:0);
 const tp=Object.values(ptr)[0];
 if(tp){const rc=c.getBoundingClientRect(),tx=camX+(tp.x-rc.left)/rc.width*VW,ty=camY+(tp.y-rc.top)/rc.height*VH+22,dx=tx-P.x,dy=ty-P.y;
  mx=Math.abs(dx)>6?Math.sign(dx):0;my=Math.abs(dy)>4?Math.sign(dy):0;
  if(tp.x<innerWidth*0.12)mx=-1;else if(tp.x>innerWidth*0.88)mx=1}
 if(!started)mx=my=0;
 if(fadeDir){mx=my=0;fade+=fadeDir*dt*4;
  if(fadeDir>0&&fade>=1){fade=1;fadeDir=-1;setMap(pending.id,pending.x)}
  else if(fadeDir<0&&fade<=0){fade=0;fadeDir=0}}
 if(mx)P.face=mx;
 P.x+=mx*70*dt;P.y=Math.max(m.y0,Math.min(m.y1,P.y+my*40*dt));
 if(!fadeDir){
  if(P.x<10){if(cur==='stovia'){pending={id:'senen',x:MAPS.senen.w-30};fadeDir=1}else P.x=10}
  else if(P.x>m.w-10){if(cur==='senen'){pending={id:'stovia',x:30};fadeDir=1}else P.x=m.w-10}
 }
 const moving=mx||my;P.t+=dt*(moving?10:5);
 const cx=Math.round(Math.max(0,Math.min(m.w-VW,P.x-VW/2))),cy=Math.round(Math.max(0,Math.min(256-VH,P.y-VH*0.7)));
 camX=cx;camY=cy;x.clearRect(0,0,VW,VH);x.save();x.translate(-cx,-cy);x.drawImage(img[m.bg],0,0);
 x.save();x.translate(Math.round(P.x),0);x.scale(P.face,1);
 const fy=Math.round(P.y)-47;
 if(moving){const f=Math.floor(P.t)%6;x.drawImage(img.walk,WC[f]-24,0,48,48,-24,fy,48,48)}
 else{const f=Math.floor(P.t)%4;x.drawImage(img.idle,f*47,0,47,48,-23,fy,47,48)}
 x.restore();
 x.drawImage(img[m.fg],0,0);x.restore();
 if(fade>0){x.fillStyle='rgba(0,0,0,'+fade+')';x.fillRect(0,0,VW,VH)}
 requestAnimationFrame(loop)}
</script></body></html>
